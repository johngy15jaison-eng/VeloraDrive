<section class="contact">

<h1>Contact Us</h1>

<p>We'd love to hear from you.</p>

<div class="container">

<div class="details">

<h2>Velora Drive</h2>

<p>📍 Kochi, Kerala, India</p>

<p>📞 +91 9876543210</p>

<p>✉ support@veloradrive.com</p>

</div>

<div class="form-box">

<form action="/send_message" method="POST">

<input type="text"
name="name"
placeholder="Your Name"
required>

<input type="email"
name="email"
placeholder="Your Email"
required>

<input type="text"
name="subject"
placeholder="Subject"
required>

<textarea
name="message"
placeholder="Your Message"
rows="6"
required></textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

</div>
