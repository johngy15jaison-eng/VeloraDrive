<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora Drive | Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<nav>

<div class="logo">
Velora <span>Drive</span>
</div>

<a href="/" class="logout">Logout</a>

</nav>


<div class="container">

<h1>Admin Dashboard</h1>

<p class="subtitle">
Manage Velora Drive from one place
</p>


<div class="cards">

<div class="card">

<div class="icon">👥</div>

<h2>{{ total_users }}</h2>

<p>Registered Users</p>

</div>


<div class="card">

<div class="icon">🚗</div>

<h2>{{ total_bookings }}</h2>

<p>Total Bookings</p>

</div>


<div class="card">

<div class="icon">📩</div>

<h2>{{ total_messages }}</h2>

<p>Contact Messages</p>

</div>

</div>


<div class="section">

<h2>Management</h2>

<div class="buttons">

<a href="/admin/users">
View Users
</a>

<a href="/admin/bookings">
View Bookings
</a>

<a href="/admin/messages">
View Messages
</a>

</div>

</div>

</div>

</body>

</html>
