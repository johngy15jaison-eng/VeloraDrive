<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Confirmed | Velora Drive</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/booking_success.css') }}">

</head>

<body>

<div class="container">

<div class="box">

<div class="tick">✓</div>

<h1>Booking Confirmed!</h1>

<p>
Thank you for choosing
<strong>Velora Drive</strong>.
</p>

<div class="details">

<p><strong>Customer :</strong> {{ customer_name }}</p>

<p><strong>Vehicle :</strong> {{ vehicle }}</p>

<p><strong>Pickup Date :</strong> {{ pickup_date }}</p>

<p><strong>Return Date :</strong> {{ return_date }}</p>

<p><strong>Payment :</strong> {{ payment }}</p>

</div>

<div class="buttons">

<a href="/home">Back to Home</a>

<a href="/vehicles">Book Another Vehicle</a>

</div>

</div>

</div>

</body>

</html>
